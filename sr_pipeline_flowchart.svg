<!-- BLOCK 1: Navigation  tab10-blue #1f77b4 -->
<rect x="165" y="20" width="350" height="442" rx="12" fill="#edf4fb" stroke="#1f77b4" stroke-width="1" stroke-dasharray="6 4"/>
<text x="340" y="36" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#0d3c6e">NAVIGATION</text>

